[project]
name = "remise-en-forme"
version = "0.6.0"
description = "Photos de pages imprimées -> DOCX/PDF mis en forme selon un profil"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless", "numpy", "pyyaml", "python-dotenv", "anthropic", "python-docx", "fpdf2", "truststore"]

[project.scripts]
remise-en-forme = "remise_en_forme.cli:main"

[tool.setuptools]
packages = ["remise_en_forme"]
